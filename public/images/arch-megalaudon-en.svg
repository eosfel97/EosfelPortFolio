<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Megalaudon server network architecture</title>
<desc>Traffic flow from Internet via Cloudflare Tunnel and Caddy to Docker containers, and private admin access via Tailscale.</desc>
<defs>
  <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#d4a838" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<text x="40" y="30" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8a7e6a">Public traffic</text>
<text x="440" y="30" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8a7e6a">Private admin traffic</text>
<rect x="40" y="50" width="200" height="56" rx="4" fill="#1d1c17" stroke="#332e25" stroke-width="1"/>
<text x="140" y="74" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#ece0c4">Internet</text>
<text x="140" y="92" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8a7e6a">Public visitors</text>
<rect x="440" y="50" width="200" height="56" rx="4" fill="#1d1c17" stroke="#332e25" stroke-width="1"/>
<text x="540" y="74" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#ece0c4">Administrator</text>
<text x="540" y="92" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8a7e6a">Laptop / mobile</text>
<line x1="140" y1="106" x2="140" y2="138" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
<line x1="540" y1="106" x2="540" y2="138" stroke="#d4a838" stroke-width="1.5" marker-end="url(#arr-g)"/>
<rect x="40" y="140" width="200" height="56" rx="4" fill="#1d1c17" stroke="#ef4444" stroke-width="1"/>
<text x="140" y="164" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#ef4444">Cloudflare Tunnel</text>
<text x="140" y="182" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8a7e6a">No public IP exposed</text>
<rect x="440" y="140" width="200" height="56" rx="4" fill="#1d1c17" stroke="#d4a838" stroke-width="1"/>
<text x="540" y="164" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#d4a838">Tailscale</text>
<text x="540" y="182" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8a7e6a">VPN mesh (WireGuard)</text>
<line x1="140" y1="196" x2="140" y2="238" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
<line x1="540" y1="196" x2="540" y2="238" stroke="#d4a838" stroke-width="1.5" marker-end="url(#arr-g)"/>
<rect x="20" y="240" width="640" height="320" rx="8" fill="#161410" stroke="#332e25" stroke-width="1"/>
<text x="40" y="264" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#ece0c4">Debian server (Megalaudon)</text>
<text x="40" y="282" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8a7e6a">Hardened host: userns-remap, cap_drop, no-new-privileges</text>
<rect x="40" y="300" width="200" height="56" rx="4" fill="#1d1c17" stroke="#ef4444" stroke-width="1"/>
<text x="140" y="324" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#ef4444">Caddy</text>
<text x="140" y="342" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8a7e6a">HTTPS reverse proxy</text>
<text x="252" y="333" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="10" fill="#d4a838">&#8592; SSH admin</text>
<line x1="540" y1="300" x2="540" y2="393" stroke="#d4a838" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-g)"/>
<line x1="140" y1="356" x2="140" y2="393" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
<rect x="30" y="395" width="620" height="145" rx="6" fill="#0e0d09" stroke="#332e25" stroke-width="1"/>
<text x="50" y="416" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#a89878">Isolated Docker network</text>
<text x="50" y="432" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8a7e6a">Containers with userns-remap, filtered access</text>
<rect x="45" y="448" width="130" height="50" rx="4" fill="#1d1c17" stroke="#332e25" stroke-width="1"/>
<text x="110" y="468" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#a89878">Vaultwarden</text>
<text x="110" y="484" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="9" fill="#8a7e6a">Password manager</text>
<rect x="190" y="448" width="130" height="50" rx="4" fill="#1d1c17" stroke="#ef4444" stroke-width="1"/>
<text x="255" y="468" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#ef4444">Portfolio</text>
<text x="255" y="484" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="9" fill="#8a7e6a">anygnahiet.dev</text>
<rect x="335" y="448" width="140" height="50" rx="4" fill="#1d1c17" stroke="#332e25" stroke-width="1"/>
<text x="405" y="468" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#a89878">Monitoring</text>
<text x="405" y="484" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="9" fill="#8a7e6a">smartmontools, Diun</text>
<rect x="490" y="448" width="140" height="50" rx="4" fill="#1d1c17" stroke="#332e25" stroke-width="1"/>
<text x="560" y="468" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#a89878">Backups</text>
<text x="560" y="484" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono',monospace" font-size="9" fill="#8a7e6a">rsync + SMTP</text>
<text x="340" y="572" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8a7e6a">solid = public traffic · dashed = private admin channel</text>
</svg>
